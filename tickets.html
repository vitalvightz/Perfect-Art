<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src https://bsxlhszipbrlisiyuwxh.supabase.co; base-uri 'none'; form-action 'none'; object-src 'none'">
<!-- This page's URL carries the buyer's private ticket link. Never send it anywhere. -->
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Your Tickets · Perfect Art</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Same tokens as the landing page. One column: order summary, then one ticket per QR code. */
:root {
  --bg: #f4f4f3; --surface: #ffffff; --fg: #111112; --muted: #5d5d61; --line: #d9d9db;
  --qr-bg: #ffffff; --qr-fg: #111112;
  --display: "Syne", "Arial Black", system-ui, sans-serif;
  --body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0e0e0f; --surface: #18181a; --fg: #f2f2f0; --muted: #a0a0a6; --line: #2c2c30; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #0e0e0f; --surface: #18181a; --fg: #f2f2f0; --muted: #a0a0a6; --line: #2c2c30; color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 400 1rem/1.6 var(--body); -webkit-font-smoothing: antialiased; }
main { max-width: 560px; margin-inline: auto; padding: clamp(1.5rem, 5vw, 3rem) 16px 4rem; display: grid; gap: 1.75rem; }
a { color: inherit; }
.wordmark { font: 800 1.05rem/1 var(--display); letter-spacing: 0.04em; text-transform: uppercase; text-decoration: none; }
.wordmark span { font-weight: 500; }
.label { font: 500 0.72rem/1.2 var(--mono); text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); }
h1 { font: 800 clamp(2rem, 8vw, 3rem)/1 var(--display); letter-spacing: -0.02em; margin: 0.5rem 0 0; text-wrap: balance; }
.meta { color: var(--muted); margin-top: 0.6rem; }
.status { border: 1px solid var(--line); border-radius: 4px; padding: 1rem 1.25rem; background: var(--surface); }
.status strong { display: block; font-weight: 600; }
.status p { margin: 0.25rem 0 0; color: var(--muted); }
.tickets { display: grid; gap: 1.25rem; }
.ticket { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.ticket-head { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; padding: 1rem 1.25rem; border-bottom: 2px dashed var(--line); }
.ticket-head b { font: 700 1.15rem/1.2 var(--display); }
.qr { display: grid; place-items: center; padding: 1.5rem; background: var(--qr-bg); }
.qr img { width: min(260px, 100%); height: auto; image-rendering: pixelated; }
.used { padding: 2rem 1.25rem; text-align: center; color: var(--muted); }
.tip { font-size: 0.9rem; color: var(--muted); }
.spinner { display: inline-block; width: 0.9em; height: 0.9em; border: 2px solid var(--line); border-top-color: var(--fg); border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: -0.1em; margin-right: 0.4em; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
</style>

<main>
  <a class="wordmark" href="./">Perfect<span> Art</span></a>

  <header id="summary" hidden>
    <p class="label" id="ticketName"></p>
    <h1 id="eventName"></h1>
    <p class="meta" id="eventMeta"></p>
  </header>

  <div class="status" id="status" role="status">
    <strong><span class="spinner" aria-hidden="true"></span>Loading your tickets…</strong>
  </div>

  <section class="tickets" id="tickets" aria-label="Your tickets"></section>

  <p class="tip" id="tip" hidden>Keep this page: bookmark it or save the link. It's your way back to these tickets. Show the QR code at the door with photo ID. Each code works once.</p>
</main>

<script src="config.js"></script>
<script src="vendor/qrcode-generator-1.4.4.js"></script>
<script src="tickets.js"></script>
</html>
