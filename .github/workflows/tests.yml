name: Tests

on:
  push:
    branches: [Mainn]
  pull_request:

permissions:
  contents: read

jobs:
  database:
    name: Database behaviour and race tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Run tests against a throwaway Postgres
        env:
          PGPASSWORD: postgres
          PSQL: psql -h localhost -U postgres
        run: supabase/tests/run.sh

  functions:
    name: Edge Functions type-check and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/*/index.ts
      - run: deno test --allow-env supabase/functions/_shared/

  site:
    name: Site browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/site_test.cjs
